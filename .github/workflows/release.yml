# A release is a tag, and a tag is `cargo build --release` plus three files.
#
# The build is reproducible from the tag: the same source, the same flags, the
# same static-CRT setting from .cargo/config.toml. Nothing here is a matrix of
# platforms, because the engine is Windows-only - a TUI that is the *shell*
# could cross-compile, but the thing being shipped is the shell plus an engine,
# and the engine is Win32 FFI.
#
# The checksum file is what install.ps1 verifies against, so producing it is part
# of the release rather than a follow-up someone forgets.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, without the leading v'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  IRSCAN_REPO: z3r0xc/irscan
  ENGINE_PATH: ir-recon

jobs:
  release:
    name: build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The engine is a private repository, so this job needs the PAT. It is the
      # only job in the project that does.
      - name: Check out the engine beside this repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.IRSCAN_REPO }}
          token: ${{ secrets.IRSCAN_TOKEN }}
          path: prov
          ref: push-main

      - name: Point the manifest at the checkout
        shell: bash
        run: |
          sed -i 's|path = "../prov/ir-recon"|path = "./prov/${{ env.ENGINE_PATH }}"|' Cargo.toml
          grep -q 'path = "./prov/${{ env.ENGINE_PATH }}"' Cargo.toml \
            || { echo "::error::the manifest rewrite did not apply"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the release
        run: cargo build --release --locked

      # The shipped binary must not need the Visual C++ redistributable, or
      # install.ps1 would install something that will not start on a clean
      # machine. The static CRT comes from .cargo/config.toml; this asserts it
      # actually took effect rather than trusting the file to still be there.
      - name: The binary needs no redistributable
        shell: pwsh
        run: |
          # Read the import table straight out of the PE file rather than shelling
          # out to `dumpbin`. `dumpbin` only exists inside a Developer Command
          # Prompt, and a GitHub runner is not one - so the first version of this
          # check failed with "the term 'dumpbin' is not recognized", and because it
          # piped stderr to $null the real reason was invisible and the step read
          # as though the binary had a CRT problem.
          #
          # PE import directory: at the offset in the optional header's data
          # directory entry 1, an array of IMAGE_IMPORT_DESCRIPTOR, each a
          # null-terminated list of DLL name RVAs.
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'target\release\irscan-tui.exe').Path
          $bytes = [System.IO.File]::ReadAllBytes($exe)

          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          # Compared byte by byte, not with [BitConverter]::ToString: that returns
          # four HEX BYTE VALUES as a string ("50-45-00-00"), and comparing that to
          # 'PE' is always false. Which is why the first run of this reported "no PE
          # signature" on a perfectly good binary.
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 `
              -or $bytes[$peOffset + 2] -ne 0 -or $bytes[$peOffset + 3] -ne 0) {
            throw "not a PE file: no PE signature at the offset the header points to"
          }
          # PE32+ (0x20b) is the only thing rustc emits for x86_64, and the data
          # directory starts at a different offset in it than in PE32.
          $optional = $peOffset + 24
          $magic = [BitConverter]::ToUInt16($bytes, $optional)
          if ($magic -ne 0x20b) { throw "expected a PE32+ image, got magic 0x$('{0:x}' -f $magic)" }
          $dirOffset = $optional + 112 + 8      # after the fixed part and one entry
          $rva = [BitConverter]::ToUInt32($bytes, $dirOffset)
          if ($rva -eq 0) { throw "the image imports nothing at all, which is not what a Rust binary does" }

          $sections = [BitConverter]::ToUInt16($bytes, $peOffset + 6)
          $table = $peOffset + 24 + [BitConverter]::ToUInt16($bytes, $peOffset + 20)
          function To-Offset([uint32] $rva) {
              for ($i = 0; $i -lt $sections; $i++) {
                  $s = $table + 40 * $i
                  $vaddr = [BitConverter]::ToUInt32($bytes, $s + 12)
                  $vsize = [BitConverter]::ToUInt32($bytes, $s + 8)
                  $raw = [BitConverter]::ToUInt32($bytes, $s + 20)
                  $rawSize = [BitConverter]::ToUInt32($bytes, $s + 16)
                  if ($rva -ge $vaddr -and $rva -lt ($vaddr + $vsize)) { return $raw + ($rva - $vaddr) }
              }
              throw "RVA 0x$('{0:x}' -f $rva) is in no section"
          }

          $names = [System.Collections.Generic.List[string]]::new()
          $desc = To-Offset $rva
          while ($true) {
              # Name RVA is the third field of IMAGE_IMPORT_DESCRIPTOR.
              $nameRva = [BitConverter]::ToUInt32($bytes, $desc + 12)
              if ($nameRva -eq 0) { break }
              $p = To-Offset $nameRva
              $end = $p
              while ($bytes[$end] -ne 0) { $end++ }
              $names.Add([Text.Encoding]::ASCII.GetString($bytes, $p, $end - $p))
              $desc += 20
          }

          "imports: " + ($names -join ', ')
          $crt = $names | Where-Object { $_ -match '^(VCRUNTIME|MSVCP\d)' }
          if ($crt) {
              throw "the binary imports $($crt -join ', '). install.ps1 would install something that cannot start on a clean Windows."
          }
          "no CRT imports"

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace 'refs/tags/', '' }
                 else { "v${{ inputs.tag }}" }
          $name = "irscan-tui-$tag-x86_64-pc-windows-msvc"
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          Copy-Item 'target\release\irscan-tui.exe' $stage
          Copy-Item README.md $stage
          Copy-Item install.ps1 $stage

          # Written in the layout `sha256sum -c` expects on Unix and
          # install.ps1 parses: hash, two spaces, asterisk, name. The asterisk is
          # binary mode, and its absence is a portability bug rather than a style
          # choice on Windows.
          $hash = (Get-FileHash "$stage\irscan-tui.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *irscan-tui.exe" | Set-Content -Path "$stage\SHA256SUMS.txt" -Encoding ascii
          $hash

          Compress-Archive -Path "$stage\*" -DestinationPath "$name.zip" -Force
          Get-Item "$name.zip" | Select-Object Name, Length

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Recomputed rather than inherited: each `run:` block is a separate
          # pwsh process and shares no variables with the previous step. The first
          # version read `$stage` from the packaging step, which is null here, and
          # failed on Join-Path with a message about the wrong thing entirely.
          $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          $name = "irscan-tui-$tag-x86_64-pc-windows-msvc"
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          if (-not (Test-Path $name)) { throw "the archive is not in the working directory: $name" }

          # Notes go in a file rather than a --notes argument. A multi-line YAML
          # string containing `irm ...: something` is read as a mapping key by the
          # parser, and the whole workflow fails to load — silently, right up until
          # someone pushes a tag. This file is also what the first release was
          # actually published with.
          $notes = @"
          A terminal interface for [irscan](https://github.com/z3r0xc/irscan), the read-only Windows endpoint triage tool.

          ## Install

          ```powershell
          irm https://raw.githubusercontent.com/z3r0xc/irscan-tui/main/install.ps1 | iex
          ```

          Then run `irscan-tui --elevate`. The flag matters - a scan without
          administrator rights cannot see the Security event log, Prefetch, or the
          image paths of protected processes, and a shorter report reads like a
          clean one.

          The binary is built with a static CRT, so it needs no Visual C++
          redistributable and nothing installed beside it.
          "@
          $notesPath = Join-Path $stage 'NOTES.md'
          $notes | Set-Content -Path $notesPath -Encoding utf8

          gh release create $tag `
            "$name.zip" `
            --repo $env:IRSCAN_REPO `
            --title "irscan-tui $tag" `
            --notes-file $notesPath `
            --generate-notes

          # SHA256SUMS.txt is uploaded after the release exists, because
          # `gh release upload` needs a release to upload to. It is what
          # install.ps1 fetches and verifies against, so a release without it
          # leaves the installer refusing to install anything at all.
          gh release upload $tag "SHA256SUMS.txt" --repo $env:IRSCAN_REPO --clobber
          "published $tag"
