# Every gate the spec names, run on every push.
#
# The same four commands run locally and here. A gate that only exists in CI is a
# gate a developer learns to ignore; one that only exists locally is a gate that
# breaks on someone else's machine on a day nobody is watching.
#
# The jobs are split because the engine is a PRIVATE repository. `GITHUB_TOKEN` only
# sees this repository, so any job needing the engine needs `secrets.IRSCAN_TOKEN`
# (a PAT with `repo` scope). Rather than make the whole pipeline depend on a secret
# that expires, the job that proves the central claim - that the interface builds
# and is tested with no engine present at all - needs no secret. So the guarantee
# cannot be taken away by an expired credential.

name: ci

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Warnings are not advisory here. The engine sets the same lint block, so
  # `cargo clippy` means the same thing in both repositories.
  RUSTFLAGS: -D warnings
  IRSCAN_REPO: z3r0xc/irscan
  # The engine's crate directory, and the suffix the manifest's `../prov/ir-recon`
  # is rewritten to where that layout cannot be reproduced.
  ENGINE_PATH: ir-recon

jobs:
  # Proves FR-1 with no secret and no engine: this is the whole interface built and
  # tested on a host where `irscan` does not exist. If a `cfg` ever leaks out of
  # src/scan.rs, this is the job that catches it.
  shell-only:
    name: shell only (no engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove the engine dependency
        run: |
          # The dependency is deleted rather than pointed at a copy. A runner
          # cannot use the engine anyway, and a build that genuinely has no
          # `irscan` is a stronger check than one where the crate is present and
          # merely gated out - it is the configuration a Linux user's machine has.
          sed -i '/^\[target\..*cfg(windows)/,+1d' Cargo.toml
          # Checked as the ACTIVE dependency line, not as the word appearing
          # anywhere. Four comments in the manifest explain why the dependency is
          # gated and one more is the package name; a plain `grep -q irscan`
          # matches those too and would fail this job for doing exactly the right
          # thing. Anchored on `^irscan = `, which is the only form it ever takes.
          if grep -q '^irscan = ' Cargo.toml; then
            echo "::error::the engine dependency survived removal, so this job proves nothing"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Formatting
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --all-targets -- --test-threads=1

  # The full matrix, with the engine present. Needs the secret.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Check out the engine beside this repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.IRSCAN_REPO }}
          token: ${{ secrets.IRSCAN_TOKEN }}
          path: prov
          # Named explicitly. The engine's default branch is `push-main`, but
          # `actions/checkout` checks out `main` for a repository that has one, and
          # the fetch of a branch that is not there is not an error you would expect:
          # it leaves an empty directory, so cargo reports a missing Cargo.toml for a
          # path that was checked out successfully. That is a genuinely confusing
          # failure, and it is why the ref is stated rather than inherited.
          ref: push-main

      - name: Point the manifest at the checkout
        shell: bash
        run: |
          if [ "${{ runner.os }}" != "Windows" ]; then
            sed -i "s|path = \"../prov/ir-recon\"|path = \"../prov/${{ env.ENGINE_PATH }}\"|" Cargo.toml
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Formatting
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --all-targets -- --test-threads=1

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The engine again: an audit resolves the whole dependency graph, and a path
      # dependency it cannot read is not an audit result, it is a confusing
      # "failed to read Cargo.toml" that looks like a broken manifest.
      - name: Check out the engine beside this repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.IRSCAN_REPO }}
          token: ${{ secrets.IRSCAN_TOKEN }}
          path: prov
          # Named explicitly. The engine's default branch is `push-main`, but
          # `actions/checkout` checks out `main` for a repository that has one, and
          # the fetch of a branch that is not there is not an error you would expect:
          # it leaves an empty directory, so cargo reports a missing Cargo.toml for a
          # path that was checked out successfully. That is a genuinely confusing
          # failure, and it is why the ref is stated rather than inherited.
          ref: push-main

      - name: Point the manifest at the checkout
        run: |
          sed -i "s|path = \"../prov/ir-recon\"|path = \"../prov/${{ env.ENGINE_PATH }}\"|" Cargo.toml

      - uses: dtolnay/rust-toolchain@stable

      - uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
